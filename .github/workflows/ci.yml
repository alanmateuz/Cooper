name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versão do campo packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install.sql em dia com as migrações
        run: node scripts/build-install-sql.mjs --check
      - run: pnpm -r typecheck
      - run: pnpm mcp:build
      # unitários + SQL num Postgres local (PGlite); não precisa de Supabase
      - run: pnpm test

  rust:
    name: cargo test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # o tauri-build confere os recursos do pacote (servidor MCP compilado)
      - run: pnpm mcp:build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
